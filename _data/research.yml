# ═══════════════════════════════════════════════════════════════
#  _data/research.yml — Single source of truth for research areas
#
#  Fields used across the site:
#    num          → research cards (homepage, research page)
#    title_ko/en  → research cards, research page full listing
#    subtitle_ko/en → cross-language subtitle on cards
#    desc_ko/en   → research card body text
#    emoji        → About page scope tags only
#    scope_tag_ko/en → About page scope tag labels (short)
#    track_ko/en  → Journal page 제4조 track list, Submit page scope grid
#    track_sub_ko/en → Submit page track subtitle / journal sub-field
#    editorial_division_ko/en → links this area to the editorial board
#
#  To add a new area: copy a block, increment num, fill all fields.
# ═══════════════════════════════════════════════════════════════

