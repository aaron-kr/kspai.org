# ═══════════════════════════════════════════════════════════════
#  _data/nav.yml  —  Site navigation structure
#
#  Each top-level item is either:
#    • A DIRECT LINK:  set url, no items list
#    • A DROPDOWN:     no url, set items list
#
#  Inside a dropdown items list:
#    • Normal item:  title_ko, title_en, url
#    • Divider:      divider: true  (just this one key)
#
#  i18n keys are optional — if omitted the title fields are used directly.
# ═══════════════════════════════════════════════════════════════

