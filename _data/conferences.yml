        status: "confirmed"
      - label_ko: "1일차 (개회식·기조강연·논문발표)"
        label_en: "Day 1 (Opening, Keynotes, Papers)"
        date_ko: "2026-11-05 (목)"
        date_en: "Thu, November 5, 2026"
