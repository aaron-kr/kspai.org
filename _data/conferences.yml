    # ── Formats ──
    formats_ko: "개회식 · 기조강연 · 9개 분과 논문발표"
    formats_en: "Opening Ceremony · Keynotes · Paper Sessions (9 tracks)"

    # ── Key Dates ──
    key_dates:
      - label_ko: "사전등록"
        label_en: "Pre-registration"
        date_ko: "접수 중"
