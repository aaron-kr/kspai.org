    status: "registration-open"

    # ── Dates ──
    date_ko: "2026-11-05 ~ 06"
    date_en: "November 5–6, 2026"
    date_from: "2026-11-05"
    date_to: "2026-11-06"

    # ── Location ──
    venue_ko: "강원연구원 리버티홀"
    venue_en: "Liberty Hall, Gangwon Research Institute"
