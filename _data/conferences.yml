    description_en: >
      The 2nd KSPAI–KLife Joint Conference, co-hosted by KSPAI and the Korea Quality of Life Information
      Society together with Jeonju National University of Education. Held over two days at the university's
      Teacher Education Center, with online and on-site oral, poster, and Padlet presentations.
      Papers are accepted from December 1 to 31, 2026.

