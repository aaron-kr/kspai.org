      한국피지컬인공지능학회와 삶의질정보학회가 전주교육대학교와 함께 개최하는 제2회 공동학술대회입니다.
      전주교육대학교 교사교육센터에서 이틀간 온라인·현장 구두 발표, 포스터 발표, 패들렛 발표로 진행됩니다.
