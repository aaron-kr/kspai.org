      - label_ko: "2일차 (논문발표)"
        label_en: "Day 2 (Paper Sessions)"
        date_ko: "2026-11-06 (금)"
        date_en: "Fri, November 6, 2026"
        status: "confirmed"

    # ── Description ──
    description_ko: >
      우리 학회와 협력을 추진 중인 강원대학교 첨단군사과학기술연구소에서 초대하는 학술대회입니다.
      강원대학교, 강원특별자치도, 강원연구원 등과 함께 한국피지컬인공지능학회가 공동 주최하며,
      국방 AI 등 9개 분과에서 60여 편의 논문이 발표됩니다. 관심 있는 분들의 많은 참여 바랍니다.
    description_en: >
      An invited conference organized by the Kangwon National University Advanced Military Science
      and Technology Research Institute, which is establishing a partnership with KSPAI. Co-hosted by
      KSPAI together with Kangwon National University, Gangwon State, and the Gangwon Research Institute,
      the program features about 60 papers across 9 tracks, including Defense AI. All interested members
      are warmly invited to attend.

    # ── Topics (paper session tracks) ──
    topics:
      - ko: "국방AI"
        en: "Defense AI"
      - ko: "국방반도체"
