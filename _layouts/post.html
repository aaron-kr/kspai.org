---
layout: default
---
<article class="post-article">
  <div class="container">
    <div class="post-header">
      <span class="news-tag {{ page.tag_class }} en">{{ page.tag_en }}</span>
      <h1 class="post-title">
        <span data-lang="ko">{{ page.title_ko | default: page.title }}</span>
        <span data-lang="en">{{ page.title_en | default: page.title }}</span>
      </h1>
      <p class="post-date mono">{{ page.date | date: "%Y.%m.%d" }}</p>
    </div>
    <div class="post-body">
      {{ content }}
    </div>
    <a href="{{ '/' | relative_url }}#news" class="btn btn-outline" style="margin-top:40px;">&larr; 소식으로 돌아가기</a>
  </div>
</article>
