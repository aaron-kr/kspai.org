<section id="research" class="research-section">
  <div class="container">
    <div class="section-label mono" data-i18n="research.label">Research Areas</div>
    <div class="section-title-row">
      <h2 class="section-title" data-i18n="research.title">연구 분야</h2>
      <a href="{{ '/research/' | relative_url }}" class="section-page-link"
         aria-label="연구분야 자세히 보기 / View full Research page">
        <span data-lang="ko">자세히 보기 →</span>
        <span data-lang="en">Full Research page →</span>
      </a>
    </div>
    <p class="section-subtitle" data-i18n="research.subtitle">
      피지컬 AI의 핵심 기술과 응용 분야를 탐구합니다.
    </p>

    <div class="research-grid">
      {% for area in site.data.research %}
      <div class="research-card">
        <div class="research-num mono">{{ area.num }}</div>
        <h3 class="research-title">
          <span data-lang="ko">{{ area.title_ko }}</span>
          <span data-lang="en">{{ area.title_en }}</span>
          <br>
          <span class="research-subtitle-lang">
            <span data-lang="ko">{{ area.subtitle_ko }}</span>
            <span data-lang="en">{{ area.subtitle_en }}</span>
          </span>
        </h3>
        <p class="research-desc">
          <span data-lang="ko">{{ area.desc_ko }}</span>
          <span data-lang="en">{{ area.desc_en }}</span>
        </p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
