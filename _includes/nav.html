<nav>
  <div class="container">
    <a href="{{ '/' | relative_url }}" class="nav-logo">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="KSPAI" class="nav-logo-img" />
      <div class="nav-logo-text">
        한국피지컬AI학회
        <span class="sub en">KSPAI</span>
      </div>
    </a>

    <ul class="nav-links">
      <li><a href="{{ '/about/'    | relative_url }}" data-i18n="nav.about"    {% if page.url contains '/about'    %}class="active"{% endif %}>소개</a></li>
      <li><a href="{{ '/research/' | relative_url }}" data-i18n="nav.research" {% if page.url contains '/research' %}class="active"{% endif %}>연구분야</a></li>
      <li><a href="{{ '/news/'     | relative_url }}" data-i18n="nav.news"     {% if page.url contains '/news'     %}class="active"{% endif %}>소식</a></li>
      <li><a href="{{ '/join/'     | relative_url }}" data-i18n="nav.join"     {% if page.url contains '/join'     %}class="active"{% endif %}>회원가입</a></li>
      <li><a href="{{ '/contact/'  | relative_url }}" data-i18n="nav.contact"  {% if page.url contains '/contact'  %}class="active"{% endif %}>문의</a></li>
    </ul>

    <div style="display:flex;align-items:center;gap:8px;">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
      </button>
      <button class="lang-toggle en" onclick="toggleLang()" aria-label="Switch to English">EN</button>
    </div>

    <button class="mobile-menu-btn"
      onclick="document.querySelector('.nav-links').classList.toggle('show')"
      aria-label="Toggle menu">☰</button>
  </div>
</nav>
