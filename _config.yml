title: 한국피지컬인공지능학회
title_en: Korean Society for Physical AI
description: 물리적 세계와 인공지능의 융합을 선도하는 학술 공동체. 로보틱스, 체화지능, 자율시스템, 디지털 트윈 등 피지컬 AI 핵심 분야를 연구합니다.
url: "https://kspai.org"
baseurl: ""

# ── SEO ──
og_image: /assets/images/og-default.png
twitter_username: "@kspai_org"
lang: ko

# ── Build settings ──
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

# ── Sass ──
sass:
  sass_dir: assets/css
  style: compressed

# ── Collections ──
collections:
  members:
    output: false
  activities:
    output: false
  conferences:
    output: true
    permalink: /conferences/:name/

# ── Defaults ──
defaults:
  - scope:
      path: ""
    values:
      robots: "index, follow"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "conferences"
    values:
      layout: "conference"

# ── Exclude from processing ──
exclude:
  - CLAUDE.md
  - PAGE-HERO-GUIDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - .sass-cache
  - vendor
  - "*.sh"
